# main 브랜치에 올릴 때마다 사이트를 빌드해 GitHub Pages 에 배포합니다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 선택하세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동으로 다시 배포할 수도 있습니다.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # 메인 화면 "Last modified" 날짜를 커밋 기록에서 읽기 위해 전체 기록을 받습니다.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build site
        run: python build.py
        env:
          # 저장소 주소 경로(/저장소이름). 자체 도메인을 연결하면 자동으로 빈 값이 됩니다.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# 사이트 전체 설정: 메뉴와 페이지 목록
# 메뉴 이름(title)은 자유롭게 바꿔도 되지만, 주소(url)를 바꾸면 기존 링크가 깨집니다.

name = "ATHENA Laboratory"
description = "ATHENA — Advanced Thermal Hydraulic Engineering for Nuclear Application Laboratory, Hanyang University. Prof. Sung Joong Kim."
logo = "/static/img/logo.png"
# 모든 페이지의 기본 배너 사진. 페이지별로 다른 사진을 쓰려면 그 [[page]]에 banner = "..." 를 적습니다.
banner = "/static/img/banner.jpg"

[[menu]]
title = "MAIN"
url = "/main"

[[menu]]
title = "RESEARCH"
url = "/research"
children = [
  { title = "Reactor Design", url = "/research/reactor-design" },
  { title = "Safety Analysis", url = "/research/safety-analysis" },
  { title = "Severe Accident", url = "/research/severe-accident" },
  { title = "AI for Nuclear Safety", url = "/research/ai-for-nuclear-safety" },
]

[[menu]]
title = "PUBLICATION"
url = "/publication"
children = [
  { title = "Journal", url = "/publication/journal" },
  { title = "Conference", url = "/publication/conference" },
  { title = "Award", url = "/publication/award" },
]

[[menu]]
title = "PEOPLE"
url = "/people"
children = [
  { title = "Principal Investigator", url = "/people/principal-investigator" },
  { title = "Research Professors", url = "/people/research-professors" },
  { title = "Emeritus Professor", url = "/people/emeritus-professor" },
  { title = "Researchers", url = "/people/researchers" },
  { title = "Graduate Students", url = "/people/graduate-students" },
  { title = "Undergraduate Students", url = "/people/undergraduate-students" },
  { title = "Staff", url = "/people/staff" },
  { title = "Alumni", url = "/people/alumni" },
]

[[menu]]
title = "CONTACT US"
url = "/contact-us"

# ── 새 방식으로 옮긴 페이지 ──────────────────────────────
# 여기 없는 페이지는 아직 기존 사이트(../dist)의 것을 그대로 사용합니다.


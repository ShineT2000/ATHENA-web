[[news]]
date = "May 21, 2026"
title = "The 4th i-SAFE-MSR Conference"
photo = "may-21-2026-the-4th-i-safe-msr-conference.jpg"
body = [
  "The 4th i-SAFE-MSR Conference was successfully held at Hanyang University, providing a forum for researchers and students to exchange the latest research outcomes on Molten Salt Reactor (MSR) technologies. Jointly organized by the i-SAFE-MSR Center, MPMES Center, and HY-IEE FINT Center, the conference covered a wide range of topics including MSR safety analysis, thermal-hydraulics, fuel behavior, and advanced computational methods.",
]

[[news]]
date = "October 23-24, 2025"
title = "The International MSR Workshop on GAMES, Jointly Hosted by Hanyang University and MIT"
photo = "october-23-24-2025-the-international-msr-workshop-on-games-j.jpg"
body = [
  "The International GAMES Workshop, jointly hosted by Hanyang University and MIT, gathered global experts to accelerate Molten Salt Reactor (MSR) deployment through advanced Modeling, Experiment, and Simulation. Focusing on these core technical pathways, the event fostered critical knowledge exchange and international collaboration between leading scholars and student researchers. This successful partnership is vital for transitioning MSR technology from research to commercial reality, paving the way for a safer, cleaner energy future.",
]

